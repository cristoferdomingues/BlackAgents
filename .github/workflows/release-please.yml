name: Release Please

# On every push to main, open or update a release pull request from the
# commit messages. Merging that pull request creates the version tag.
# The tag starts the desktop build in release.yml.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
